name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: SelfatorLock
      - uses: actions/upload-artifact@v4
        with:
          name: Selfator-apk
          path: SelfatorLock/app/build/outputs/apk/debug/app-debug.apk
